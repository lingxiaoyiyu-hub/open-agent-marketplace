[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stepfun-tools"
version = "0.1.0"
description = "StepFun (阶跃星辰) Audio, Image and Video Tool Suite & MCP Server"
readme = "README.md"
authors = [{ name = "Antigravity Agent" }]
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0"
]

[project.scripts]
stepfun = "stepfun.cli:main"
stepfun-mcp = "stepfun.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
