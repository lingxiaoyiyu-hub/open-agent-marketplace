[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-studio-tools"
version = "1.2.0"
description = "Media Studio — vendor-neutral multimodal media suite (TTS/ASR/Subtitle/Mixcut/Image/Video) with MCP Server"
readme = "README.md"
authors = [{ name = "Antigravity Agent" }]
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0"
]

[project.scripts]
media-studio = "media_studio.cli:main"
media-studio-mcp = "media_studio.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
